name: autorunner-control-plane

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-autorunner}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatória}@postgres:5432/${POSTGRES_DB:-autorunner}
  BETTER_AUTH_URL: ${PUBLIC_BASE_URL}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET obrigatória}
  TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:?TRUSTED_ORIGINS obrigatória}
  ALLOW_PUBLIC_SIGNUP: "false"
  AGENT_SECRET_PEPPER: ${AGENT_SECRET_PEPPER:?AGENT_SECRET_PEPPER obrigatória}
  REALTIME_SIGNING_SECRET: ${REALTIME_SIGNING_SECRET:?REALTIME_SIGNING_SECRET obrigatória}
  INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET obrigatória}
  WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?WEBHOOK_ENCRYPTION_KEY obrigatória}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL obrigatória}
  PUBLIC_WS_URL: ${PUBLIC_WS_URL:?PUBLIC_WS_URL obrigatória}
  COMMAND_DEFAULT_TTL_SECONDS: ${COMMAND_DEFAULT_TTL_SECONDS:-900}
  COMMAND_MAX_RUNNING_SECONDS: ${COMMAND_MAX_RUNNING_SECONDS:-86400}
  MAX_AGENT_MESSAGE_BYTES: ${MAX_AGENT_MESSAGE_BYTES:-1048576}
  MAX_CLI_OUTPUT_BYTES: ${MAX_CLI_OUTPUT_BYTES:-65536}
  GRAPHQL_MAX_DEPTH: ${GRAPHQL_MAX_DEPTH:-10}
  GRAPHQL_MAX_FIELDS: ${GRAPHQL_MAX_FIELDS:-250}
  GRAPHQL_MAX_BODY_BYTES: ${GRAPHQL_MAX_BODY_BYTES:-1048576}
  GRAPHQL_REQUESTS_PER_MINUTE: ${GRAPHQL_REQUESTS_PER_MINUTE:-300}
  GRAPHQL_ALLOW_INTROSPECTION: ${GRAPHQL_ALLOW_INTROSPECTION:-false}
  WEBSOCKET_UPGRADES_PER_MINUTE: ${WEBSOCKET_UPGRADES_PER_MINUTE:-120}
  APPROVED_AGENT_VERSION: ${APPROVED_AGENT_VERSION:-3.0.0-RC}
  HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-30}
  OFFLINE_AFTER_SECONDS: ${OFFLINE_AFTER_SECONDS:-90}
  WEBHOOK_TIMEOUT_MS: ${WEBHOOK_TIMEOUT_MS:-8000}
  WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-8}
  EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-90}
  RETENTION_CLEANUP_INTERVAL_SECONDS: ${RETENTION_CLEANUP_INTERVAL_SECONDS:-3600}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
  WEBHOOK_ALLOW_HTTP: ${WEBHOOK_ALLOW_HTTP:-false}

services:
  postgres:
    image: postgres:17.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autorunner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatória}
      POSTGRES_DB: ${POSTGRES_DB:-autorunner}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autorunner} -d ${POSTGRES_DB:-autorunner}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [control]

  domain-migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.control-plane
    restart: "no"
    environment: *app-env
    command: ["node","deploy/scripts/migrate-domain.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [control]
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  auth-migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.control-plane
    restart: "no"
    environment:
      <<: *app-env
      ALLOW_PUBLIC_SIGNUP: "true"
    command: ["npm","run","migrate:auth"]
    depends_on:
      domain-migrate:
        condition: service_completed_successfully
    networks: [control]
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  bootstrap-admin:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.control-plane
    restart: "no"
    environment:
      <<: *app-env
      ALLOW_PUBLIC_SIGNUP: "true"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL obrigatória}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD obrigatória}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrador}
      BOOTSTRAP_ORGANIZATION_NAME: ${BOOTSTRAP_ORGANIZATION_NAME:-Alpha Software}
    command: ["node","deploy/scripts/bootstrap-admin.ts"]
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
    networks: [control]
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  ms-a:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.control-plane
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE_NAME: ms-a-rest
    command: ["node","services/ms-a-rest/src/server.ts"]
    depends_on:
      bootstrap-admin:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 12
    networks: [control]
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  ms-b:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.control-plane
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE_NAME: ms-b-query-events
    command: ["node","services/ms-b-query-events/src/server.ts"]
    depends_on:
      ms-a:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 12
    networks: [control]
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  ms-c:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.control-plane
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE_NAME: ms-c-realtime
    command: ["node","services/ms-c-realtime/src/server.ts"]
    depends_on:
      ms-a:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8083/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 12
    networks: [control]
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      AUTORUNNER_SITE_ADDRESS: ${AUTORUNNER_SITE_ADDRESS:-http://localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../apps/central-web:/srv/central:ro
      - ../../assets:/srv/central/assets:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      ms-a:
        condition: service_healthy
      ms-b:
        condition: service_healthy
      ms-c:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 4s
      retries: 12
    networks: [control]

networks:
  control:
    driver: bridge

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
